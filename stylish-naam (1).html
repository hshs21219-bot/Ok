<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Noto Sans Devanagari","Hind",system-ui,sans-serif;line-height:1.6;background:radial-gradient(120% 90% at 20% 0%,#5B2BE0 0%,#2A1470 40%,#0C0A2E 100%);background-attachment:fixed;overflow-x:hidden}
#stage{position:fixed;inset:0;perspective:900px;overflow:hidden;z-index:0;pointer-events:none}
#grid{position:absolute;left:-50%;width:200%;height:70%;bottom:-18%;transform:rotateX(68deg);transform-origin:bottom;background-image:linear-gradient(rgba(0,255,230,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,61,154,.55) 2px,transparent 2px);background-size:70px 70px;animation:slide 3s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
@keyframes slide{to{background-position:0 70px}}
.cube{position:absolute;transform-style:preserve-3d;animation:spin var(--d) linear infinite,bob calc(var(--d)*.6) ease-in-out infinite alternate}
.cube i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.55}
@keyframes spin{to{transform:rotateX(360deg) rotateY(720deg)}}
@keyframes bob{from{margin-top:-24px}to{margin-top:24px}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.25;margin:0 0 6px;font-weight:700;text-shadow:0 2px 18px rgba(255,61,154,.6)}
p.sub{margin:0 0 18px;color:var(--mute)}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);backdrop-filter:blur(8px)}
input:focus-visible,button:focus-visible{outline:3px solid #00F0D8;outline-offset:2px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--accInk);border-color:transparent}
ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}
.out{flex:1;font-size:21px;overflow-wrap:anywhere;font-family:"Noto Sans Devanagari","Noto Sans Symbols 2","Noto Sans Math",system-ui,sans-serif}
.lbl{display:block;font-size:12px;color:var(--mute)}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:var(--accInk);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:9px 11px}
button.on{color:#FF3D9A;border-color:#FF3D9A}
button.done{background:#00C9B1;color:#04122B}
.bar{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{margin-top:18px;font-size:14px;color:var(--mute)}
h2{font-size:18px;margin:26px 0 0}
@media (prefers-reduced-motion:reduce){.cube,#grid{animation:none}}
</style>
</head>

  const map=[[/माफिया|मफिया|mafia|डॉन|don/,2,"माफिया"],[/गेम|game|gaming|pubg|bgmi|free ?fire/,3,"गेमिंग"],[/एटीट्यूड|attitude|swag|एटिट्यूड/,4,"एटीट्यूड"],[/प्यार|क्यूट|cute|लड़की|girl|princess/,5,"प्यारे"],[/हिंदी|hindi|देसी/,1,"हिंदी"]];
  const m=map.find(x=>x[0].test(u)),i=m?m[1]:0,v=val();
  const names=i?pk(cats[i][1].map(f=>f(v)[0]),5):pk(styles,5).map(([n,f])=>f(v));
  return (m?"ये लीजिए "+m[2]+" नाम।":"ये लीजिए कुछ स्टाइलिश नाम। बोलें: माफिया, गेमिंग, एटीट्यूड या प्यारे।")+"\n"+names.join("\n")};
 const sample=sm||(async t=>({text:local(t)}));
 $("ai").hidden=false;
 const hist=[],q=$("q"),chat=$("chat"),mic=$("mic");
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)mic.hidden=true;
 const SYS="तुम एक स्टाइलिश नाम सुझाने वाले दोस्ताना सहायक हो। हिंदी में जवाब दो। पहली लाइन में बोलने लायक एक छोटा वाक्य लिखो (इमोजी या सिंबल के बिना)। उसके नीचे अधिकतम 5 स्टाइलिश नाम अलग-अलग लाइन में दो (फ़ॉन्ट स्टाइल, इमोजी, सजावट के साथ)। मार्कडाउन नहीं। अगर यूज़र नाम न बताए तो इसे इस्तेमाल करो: ";
 function add(me,t){const d=document.createElement("div");d.className="msg"+(me?" me":"");d.textContent=(me?"आप: ":"AI: ")+t;chat.appendChild(d)}
 function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";speechSynthesis.speak(u)}catch(e){}}
 let busy=false;
 async function go(){
  const t=q.value.trim();if(!t||busy)return;busy=true;q.value="";add(true,t);
  try{
   const r=await sample(SYS+val()+"\n\nपिछली बातचीः\n"+hist.join("\n")+"\n\nयूज़र: "+t,{cache:false});
   const out=(r.text||"").trim();hist.push("यूज़र: "+t,"AI: "+out);add(false,out);speak(out.split("\n")[0]);
  }catch(e){add(false,"AI अभी जवाब नहीं दे पाया, थोड़ी देर बाद फिर कोशिश करें।")}
  busy=false}
 $("send").onclick=go;q.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
 mic.onclick=()=>{try{const r=new SR();r.lang="hi-IN";r.onresult=e=>{q.value=e.results[0][0].transcript;go()};r.onerror=()=>{mic.textContent="माइक बंद — लिखकर भेजें"};r.onend=()=>{if(mic.textContent==="🔴 सुन रहा हूँ")mic.textContent="🎙 बोलें"};mic.textContent="🔴 सुन रहा हूँ";r.start()}catch(e){mic.hidden=true}};
})();
</script>
